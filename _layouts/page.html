---
layout: default
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title">
      <span lang="en">{{ page.title | escape }}</span>
      {%- if page.title_zh -%}<span lang="zh">{{ page.title_zh }}</span>{%- endif -%}
    </h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
